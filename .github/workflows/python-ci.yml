name: Python CI

# Trigger on pushes to your branch and PRs to main
on:
  push:
    branches: [ ci-workflow ]  # your working branch
  pull_request:
    branches: [ main ]         # PRs to main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]  # valid Python versions

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Use GitHub Secret (demo)
      run: echo "Demo secret value is ${{ secrets.TEST_SECRET }}"

    - name: Run tests with coverage
      run: |
        # Fail if coverage is less than 90%
        pytest --cov=bank_account --cov-fail-under=90

    - name: Introduce failing test (optional demo)
      if: false  # set to true to force a failing build
      run: |
        echo "def test_fail(): assert 1 == 2" > tests/test_fail.py

